name: Optiant
description: Optiant, Inc. was a Boston-area supply chain optimization software company founded in 2000
  on multi-echelon inventory optimization technology developed by researchers at MIT. Its flagship
  PowerChain suite (Network Design, Inventory, and Planner) let global manufacturers and distributors
  model multidimensional supply chains and free up working capital trapped across multi-echelon networks.
  Optiant was acquired by Logility, Inc. in 2010 (~$3.3M) and its technology was folded into Logility's
  Voyager Solutions suite as Voyager Inventory Optimization. The company no longer operates independently
  and publishes no public API surface; the optiant.com domain no longer resolves. This profile was
  surfaced as a Battery Ventures portfolio company and enriched as a historical/defunct lead.
